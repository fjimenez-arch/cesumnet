name: Desplegar a GitHub Pages

on:
  # Se ejecuta en cada cambio subido a la rama principal
  push:
    branches: [main]
  # Permite ejecutarlo manualmente desde la pestaña "Actions"
  workflow_dispatch:

# Permisos que necesita el despliegue a Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Evita despliegues simultáneos; deja terminar el que esté en curso
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 1) Compila el sitio
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar el sitio (Astro)
        run: npm run build

      - name: Subir el artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  # 2) Publica el sitio compilado
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
